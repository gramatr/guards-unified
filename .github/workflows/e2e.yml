name: E2E (real models)

# Starts the real CPU image with the real PII engine and the gated injection
# model and runs tests/e2e_real_models_test.py against /v1/scan. Nothing else
# in CI can do this: the injection model is a gated Hugging Face download, so
# ci.yml stubs both models (tests/api_contract_test.py).
#
# Needs a repository secret named HF_TOKEN (a Hugging Face token whose account
# has accepted the Llama 4 Community License). A maintainer must create it;
# until it exists this workflow FAILS with a clear message rather than passing.
#
# Runs on the same self-hosted arm64 runner group as publish.yml's arm64 jobs
# (dgx-arm64-public). It builds Dockerfile.cpu natively there; nothing is
# pushed to any registry.
#
# Release gating: ADVISORY, not a `needs:` of publish.yml. A tag push starts
# this workflow and publish.yml side by side (they are separate workflows, so
# `needs:` cannot reach across them without turning this into a reusable
# workflow called from publish.yml), and a missing or expired HF_TOKEN would
# then block every release. The release checklist in docs/RELEASING.md makes
# a green run of this workflow for the tag a required step instead. Promote it
# to a hard gate once the secret is in place and has been green for a while.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    # Weekly, Tuesdays (ci.yml's CVE scan is Mondays), so a drifting
    # dependency or a changed upstream model shows up without a release.
    - cron: "0 9 * * 2"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, ARM64, local-gpu]
    timeout-minutes: 60
    env:
      IMAGE: guards-unified-e2e:${{ github.run_id }}-${{ github.run_attempt }}
      NAME: guards-unified-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: HF_TOKEN repository secret must exist
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error title=HF_TOKEN missing::The repository secret HF_TOKEN is not set (or not visible to this run). The injection model is gated, so the real-model E2E cannot run. A maintainer must create it: Settings > Secrets and variables > Actions > New repository secret, a Hugging Face token whose account accepted the Llama 4 Community License. This run fails on purpose rather than passing without testing anything."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the CPU image (native arm64, not pushed)
        run: docker build -f Dockerfile.cpu -t "$IMAGE" .

      - name: Start the service
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Loopback only, random host port (the runner is shared). The token
          # is passed by name so it never appears on a command line.
          docker run -d --name "$NAME" -e HF_TOKEN -p 127.0.0.1::8700 "$IMAGE"
          port="$(docker port "$NAME" 8700/tcp | head -1 | sed 's/.*://')"
          echo "ENDPOINT=http://127.0.0.1:${port}" >> "$GITHUB_ENV"

      - name: Wait for /health (first start downloads the models)
        run: |
          for i in $(seq 1 180); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" != "true" ]; then
              echo "::error::container exited before becoming healthy"; exit 1
            fi
            if curl -fsS -m 5 "$ENDPOINT/health" >/dev/null 2>&1; then
              echo "healthy after about $((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "::error::/health did not answer within 15 minutes"; exit 1

      - name: End-to-end test
        run: python3 tests/e2e_real_models_test.py --endpoint "$ENDPOINT"

      - name: Service log (on failure)
        if: failure()
        run: docker logs --tail 100 "$NAME" || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f "$NAME" || true
          docker rmi -f "$IMAGE" || true
