name: Publish

# Tag-triggered, not push-to-main — these images get pulled straight
# into other hosts' docker-compose stacks (see claude-plugin-guards'
# guards/docker/docker-compose.yml), so a push to main must not
# silently become a new `:cpu`/`:gpu` for everyone until someone cuts
# a release. Tag with `vX.Y.Z` to publish.
#
# Fully automated as of 2026-10-19: amd64 builds on GitHub-hosted
# runners, arm64+GPU builds on a self-hosted runner (labels
# self-hosted/Linux/ARM64/local-gpu/sm87), then both halves are merged
# into real multi-arch :cpu/:gpu tags. The arm64 runner sits in a
# narrowly-scoped org runner group that allows public repos and is
# restricted to exactly this repo + claude-plugin-guards: the org's
# default runner group refuses jobs from public repos, and for good
# reason (a public repo's own CI workflow running on a self-hosted
# runner is a real attack surface; the same policy keeps secret-guard/
# pii-guard's own CI on GitHub-hosted runners).
#
# GPU cross-building under QEMU is still never attempted (this repo's
# own Dockerfile header documents that as tried-and-abandoned, too
# slow, and CUDA correctness can't be verified under emulation) --
# arm64 builds NATIVELY on that runner, which is what makes this
# safe to automate at all.
#
# Auth: the default GITHUB_TOKEN, with `packages: write` below. This
# only works because the ghcr.io/gramatr/guards-unified package is
# linked to this repo AND this repo has Write under the package's
# "Manage Actions access" -- both are web-UI-only settings (no REST
# API), and both are lost if the repo is ever deleted and recreated
# (this happened 2026-10-19). If a publish fails with
# `permission_denied: write_package`, re-check those two settings
# first; run the "Pipeline check" workflow to test them without
# touching any release tag. Fallback if the link can't be made to
# work: a PAT with write:packages stored as GHCR_PUBLISH_TOKEN.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Manual recovery only: version tag (vX.Y.Z) to re-run merge-multiarch for, if a normal tag-push run built both halves but the merge step itself needs re-running."
        required: true

permissions:
  contents: read
  packages: write

jobs:
  verify-tag-matches-version:
    if: github.event_name == 'push'
    # "Clean release" means the tag we're about to publish from is the
    # same version the VERSION-bump PR actually merged -- not whatever
    # commit happened to be on main when someone ran `git tag`. Fails
    # loudly rather than silently publishing a mismatched version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag vs VERSION file
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag v$tag does not match VERSION file ($file) on this commit. Bump VERSION in a PR, merge it, THEN tag that merge commit."
            exit 1
          fi
      - name: CHANGELOG has a section for this version
        # The release page (job `release`) takes its notes from CHANGELOG.md. Checking it
        # here means a missing entry stops the run before any image is published,
        # not after.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$ver\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$ver]' section. Add it in a PR, merge it, THEN tag that merge commit."
            exit 1
          fi

  gitleaks-assets:
    # Standalone patched gitleaks binaries for hosts without Docker (issue #55). The
    # upstream release binary bundles Go modules with known HIGH CVEs; the image carries
    # a patched build, and this builds the same thing, from the same recipe in
    # Dockerfile.cpu, for linux and darwin on amd64 and arm64. The plugin's self-heal
    # downloads one and checks it against binary hashes the plugin carries.
    #
    # The build is reproducible, and that is enforced: the binaries' SHA-256 must equal
    # docs/gitleaks-assets.sha256 or this job fails. Changing the gitleaks recipe means
    # updating that file (and the copy in claude-plugin-guards) in the same change.
    # Nothing here publishes; the `release` job attaches the result to the release.
    if: github.event_name == 'push'
    needs: verify-tag-matches-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Sigstore keyless signing of the provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the four binaries and package them
        run: bash tests/gitleaks_assets.sh build assets

      - name: The binaries are the ones recorded in docs/gitleaks-assets.sha256
        run: bash tests/gitleaks_assets.sh check assets

      - name: Attest build provenance for the packaged assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-assets
          path: assets/
          if-no-files-found: error

  build-amd64:
    if: github.event_name == 'push'
    needs: verify-tag-matches-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Dockerfile for this variant
        id: file
        run: |
          if [ "${{ matrix.variant }}" = "cpu" ]; then
            echo "dockerfile=Dockerfile.cpu" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (amd64)
        # -amd64 suffix, not the bare :cpu/:gpu -- publishing straight
        # to the bare tag here is the exact bug found 2026-10-19: it
        # makes an amd64-ONLY image "the" :cpu tag immediately, so an
        # arm64 host pulling :cpu gets a platform mismatch. The bare
        # :cpu/:gpu tags are only ever written by merge-multiarch,
        # below, as a real multi-arch manifest.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.file.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-amd64
            ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-amd64-${{ github.ref_name }}
            ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-sha-${{ github.sha }}

      - name: Trivy scan the just-published image before anyone pulls it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-amd64-${{ github.ref_name }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  build-arm64:
    if: github.event_name == 'push'
    needs: verify-tag-matches-version
    # Membership in the org runner group for public repos is what makes this runner
    # reachable from this public repo's own workflow at all -- see the
    # header comment. Native build, no QEMU: this box has the real
    # aarch64 + GPU hardware.
    runs-on: [self-hosted, ARM64, local-gpu]
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Dockerfile for this variant
        id: file
        run: |
          if [ "${{ matrix.variant }}" = "cpu" ]; then
            echo "dockerfile=Dockerfile.cpu" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (native arm64)
        run: |
          docker build -f ${{ steps.file.outputs.dockerfile }} \
            -t ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-arm64 \
            -t ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-arm64-${{ github.ref_name }} \
            -t ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-arm64-sha-${{ github.sha }} \
            .
          docker push ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-arm64
          docker push ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-arm64-${{ github.ref_name }}
          docker push ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-arm64-sha-${{ github.sha }}

      - name: Trivy scan the just-published image before anyone pulls it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-arm64-${{ github.ref_name }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Logout — shared host, don't leave a token sitting in its docker config
        if: always()
        run: docker logout ghcr.io

  merge-multiarch:
    # Runs automatically on a normal tag push, once both halves exist.
    # workflow_dispatch stays as a manual recovery path only -- e.g. if
    # this step itself needs re-running without rebuilding either half.
    #
    # Order matters (epic #58, issue #51): the merged image is first written to a
    # STAGING tag, scanned, attested and verified, and only then promoted to the
    # versioned tag and the bare :cpu/:gpu tag. A failed scan or a failed attestation
    # fails the job before either tag moves, so an unscanned or unsigned image is
    # never the one users pull. The staging tag is the same manifest (same digest).
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success'))
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # Sigstore keyless signing of the attestations
      attestations: write
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      # Needed for .trivyignore below -- without it, the Trivy scan
      # step has no working directory content at all and re-flags the
      # 34 already-tracked, upstream-blocked gitleaks Go CVEs (#7) as
      # new, every single run. Confirmed by testing this job for real
      # against v0.1.2 (2026-10-19). Also provides the local attest-image action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge amd64 + arm64 into one multi-arch staging tag
        id: merge
        run: |
          staging=ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-staging-${{ steps.version.outputs.value }}
          docker buildx imagetools create -t "$staging" \
            ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-amd64-${{ steps.version.outputs.value }} \
            ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-arm64-${{ steps.version.outputs.value }}
          digest="$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')"
          case "$digest" in sha256:*) ;; *) echo "::error::could not read the staging digest (got '$digest')"; exit 1 ;; esac
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Trivy scan the merged image before any release tag points at it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-staging-${{ steps.version.outputs.value }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Attest provenance and SBOM, then verify
        uses: ./.github/actions/attest-image
        with:
          image: ghcr.io/gramatr/guards-unified
          digest: ${{ steps.merge.outputs.digest }}
          name: ${{ matrix.variant }}

      - name: Promote the attested image to the versioned and bare tags
        run: |
          docker buildx imagetools create \
            -t ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-${{ steps.version.outputs.value }} \
            -t ghcr.io/gramatr/guards-unified:${{ matrix.variant }} \
            "${{ steps.merge.outputs.staging }}"
          for tag in ${{ matrix.variant }}-${{ steps.version.outputs.value }} ${{ matrix.variant }}; do
            got="$(docker buildx imagetools inspect ghcr.io/gramatr/guards-unified:$tag --format '{{.Manifest.Digest}}')"
            if [ "$got" != "${{ steps.merge.outputs.digest }}" ]; then
              echo "::error::tag $tag points at $got, not the attested ${{ steps.merge.outputs.digest }}"
              exit 1
            fi
          done

  release:
    # Created only after the images are merged, scanned, attested and promoted, so a
    # failed publish never leaves a release page. Evidence is produced here by CI, not
    # by hand: the unfiltered Trivy scan of each published image, the SBOMs from the
    # signing step, test counts (including the redaction self-test run against the
    # published CPU image) and the changelog text for this version.
    # `contents: write` is held by this job only; the build and merge jobs do not have it.
    if: github.event_name == 'push'
    needs: [merge-multiarch, gitleaks-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      actions: read   # download the SBOM artifacts uploaded by this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install fastapi httpx pydantic

      - name: Collect the evidence (changelog section, test counts, self-test on the published image)
        run: |
          mkdir -p release-assets
          bash tests/release_evidence.sh "${GITHUB_REF_NAME#v}" "ghcr.io/gramatr/guards-unified:cpu-${GITHUB_REF_NAME}" release-assets

      - name: Trivy scan of the published CPU image, full report, no ignore file
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/gramatr/guards-unified:cpu-${{ github.ref_name }}
          format: json
          output: release-assets/trivy-cpu.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Trivy scan of the published GPU image, full report, no ignore file
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/gramatr/guards-unified:gpu-${{ github.ref_name }}
          format: json
          output: release-assets/trivy-gpu.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Download the SBOMs written by the signing step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" -n sbom-cpu.spdx.json -D release-assets
          gh run download "${{ github.run_id }}" -n sbom-gpu.spdx.json -D release-assets
          gh run download "${{ github.run_id }}" -n gitleaks-assets -D release-assets

      - name: Create the release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cpu="$(docker buildx imagetools inspect "ghcr.io/gramatr/guards-unified:cpu-$TAG" --format '{{.Manifest.Digest}}')"
          gpu="$(docker buildx imagetools inspect "ghcr.io/gramatr/guards-unified:gpu-$TAG" --format '{{.Manifest.Digest}}')"
          {
            cat release-assets/release-notes.md
            printf '\n---\n\n### Images\n\n'
            printf -- '- `ghcr.io/gramatr/guards-unified:cpu-%s` (`%s`)\n' "$TAG" "$cpu"
            printf -- '- `ghcr.io/gramatr/guards-unified:gpu-%s` (`%s`)\n' "$TAG" "$gpu"
            printf '\n### Verify where it came from\n\n```\n'
            printf 'gh attestation verify oci://ghcr.io/gramatr/guards-unified:cpu-%s --repo gramatr/guards-unified\n' "$TAG"
            printf 'gh attestation verify oci://ghcr.io/gramatr/guards-unified:cpu-%s --repo gramatr/guards-unified --predicate-type https://spdx.dev/Document/v2.3\n' "$TAG"
            printf '```\n\nAttestations show which workflow built the image and what is in it. They do not show that the code is free of bugs or malice.\n'
            printf '\n### Attached evidence\n\n'
            printf -- '- `trivy-cpu.json`, `trivy-gpu.json`: full Trivy image scans, all severities, no ignore file.\n'
            printf -- '- `sbom-cpu.spdx.json`, `sbom-gpu.spdx.json`: SPDX SBOMs.\n'
            printf -- '- `gitleaks-patched_*`: standalone patched gitleaks for hosts without Docker (linux and darwin, amd64 and arm64), their checksums and binary hashes, with build provenance. `gh attestation verify <file> --repo gramatr/guards-unified` checks one.\n'
            printf -- '- `test-counts.txt`: suite results for this commit:\n\n```\n'
            cat release-assets/test-counts.txt
            printf '```\n'
          } > release-body.md
          assets=(release-assets/trivy-cpu.json release-assets/trivy-gpu.json release-assets/sbom-cpu.spdx.json release-assets/sbom-gpu.spdx.json release-assets/test-counts.txt release-assets/gitleaks-patched_*)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run after this step failed part-way: update the page, do not fail on it.
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file release-body.md
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" --notes-file release-body.md
          fi
