name: Publish

# Tag-triggered, not push-to-main — these images get pulled straight
# into other hosts' docker-compose stacks (see claude-plugin-guards'
# guards/docker/docker-compose.yml), so a push to main must not
# silently become a new `:cpu`/`:gpu` for everyone until someone cuts
# a release. Tag with `vX.Y.Z` to publish.
#
# amd64 only here, on purpose, for BOTH variants -- GitHub-hosted
# runners are amd64 with no GPU. Cross-building arm64 under QEMU in
# one job is exactly what this repo's Dockerfile header already
# documents as tried-and-abandoned for the GPU variant (too slow), and
# CUDA correctness can't be verified under emulation anyway. arm64 +
# real-GPU builds stay the documented manual process (native build on
# each real host, e.g. dgx-spark-01, then `docker buildx imagetools
# create` to combine) until a self-hosted ARM/GPU runner exists to
# automate that safely -- not attempted here.
#
# Auth: ghcr.io/gramatr/guards-unified's container package predates
# any Actions-based push and was never linked to this repo (GitHub
# only exposes that link via the package's web UI, no REST API for
# it -- confirmed 2026-10-19), so the default GITHUB_TOKEN gets
# `permission_denied: write_package` even with `packages: write`
# declared below. GHCR_PUBLISH_TOKEN (an org-admin PAT with
# write:packages) works around that. Revisit if the package ever gets
# linked via the UI -- GITHUB_TOKEN would then be preferable.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  verify-tag-matches-version:
    # "Clean release" means the tag we're about to publish from is the
    # same version the VERSION-bump PR actually merged -- not whatever
    # commit happened to be on main when someone ran `git tag`. Fails
    # loudly rather than silently publishing a mismatched version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag vs VERSION file
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag v$tag does not match VERSION file ($file) on this commit. Bump VERSION in a PR, merge it, THEN tag that merge commit."
            exit 1
          fi

  build-and-push:
    needs: verify-tag-matches-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: bhandrigan
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Resolve Dockerfile for this variant
        id: file
        run: |
          if [ "${{ matrix.variant }}" = "cpu" ]; then
            echo "dockerfile=Dockerfile.cpu" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.file.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gramatr/guards-unified:${{ matrix.variant }}
            ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-${{ github.ref_name }}
            ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-sha-${{ github.sha }}

      - name: Trivy scan the just-published image before anyone pulls it
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/gramatr/guards-unified:${{ matrix.variant }}-${{ github.ref_name }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
