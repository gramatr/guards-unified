name: Pipeline check

# Manual smoke test for the release pipeline's two out-of-band
# prerequisites, without publishing a release or touching any real tag:
#
#   1. The ghcr.io package is linked to this repo and this repo has
#      Write under the package's "Manage Actions access" (web-UI-only
#      settings, lost if the repo is recreated). Tested by pushing a
#      tiny empty image to a scratch tag with GITHUB_TOKEN (the tag is left
#      behind on purpose, see the note in the registry-push job).
#   2. This repo is in the org runner group that allows public repos to
#      use the self-hosted arm64/GPU runner, so the arm64/GPU build can
#      reach it. Tested by running a trivial job on that runner.
#
#   3. Image signing (epic #58, #51): a scratch multi-arch image is attested
#      (provenance + SBOM) through the same local action the release uses, then
#      verified from the registry. Proves the OIDC and attestation permissions
#      and the verify command without a release. The attestations go to the
#      public Sigstore log, which is permanent; the subject is an empty image.
#
# Never touches :cpu, :gpu, or any vX.Y.Z tag. workflow_dispatch only
# (no pull_request trigger), so nobody without write access can run
# code on the self-hosted runner from this public repo.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  registry-push:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push an empty scratch image
        run: |
          printf 'FROM scratch\nLABEL org.opencontainers.image.description="pipeline-check scratch image, safe to delete"\n' \
            | docker buildx build --push -t ghcr.io/gramatr/guards-unified:link-check -

      - name: Confirm it is readable back from the registry
        run: docker buildx imagetools inspect ghcr.io/gramatr/guards-unified:link-check

      # No cleanup step: GITHUB_TOKEN cannot list package versions (404) and
      # deleting one needs a delete:packages token, which this workflow must
      # not hold. The scratch image is empty and harmless; delete the
      # :link-check tag in the package UI whenever convenient.

  arm64-runner:
    runs-on: [self-hosted, ARM64, local-gpu]
    steps:
      - name: Show where we landed
        run: |
          echo "arch: $(uname -m)"
          echo "host: $(hostname)"
          test "$(uname -m)" = "aarch64"

  attest-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FROM scratch with a COPY needs no emulation, so a two-platform index builds
      # on this runner and has the same shape (an index of two manifests) as the
      # release's merged image.
      - name: Push a two-platform scratch image
        run: |
          printf 'FROM scratch\nCOPY VERSION /VERSION\nLABEL org.opencontainers.image.description="pipeline-check scratch image, safe to delete"\n' > "$RUNNER_TEMP/Dockerfile.scratch"
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -f "$RUNNER_TEMP/Dockerfile.scratch" -t ghcr.io/gramatr/guards-unified:attest-check .
          digest="$(docker buildx imagetools inspect ghcr.io/gramatr/guards-unified:attest-check --format '{{.Manifest.Digest}}')"
          case "$digest" in sha256:*) ;; *) echo "::error::no digest (got '$digest')"; exit 1 ;; esac
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Attest provenance and SBOM, then verify
        uses: ./.github/actions/attest-image
        with:
          image: ghcr.io/gramatr/guards-unified
          digest: ${{ env.DIGEST }}
          name: attest-check
