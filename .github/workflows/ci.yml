name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of any code change — the Dockerfiles pin
    # `>=` version floors, not exact versions, so the actual installed
    # torch/transformers/presidio/etc. versions drift with every base
    # image rebuild. This is what catches a newly-disclosed CVE in
    # whatever actually got installed, without anyone having to
    # remember to re-run a scan by hand.
    - cron: "0 7 * * 1"

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/

  cve-scan-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (Dockerfiles, app source)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  cve-scan-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t guards-unified:ci-cpu .
      - name: Trivy image scan — actual installed deps, not the Dockerfile's version floors
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: guards-unified:ci-cpu
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  flag-scheduled-failure:
    needs: [lint, cve-scan-source, cve-scan-image]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue — don't rely on anyone noticing the red check
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI: scheduled lint/CVE scan failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The weekly scheduled run of [this workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed on main with no associated code change — likely a newly-disclosed CVE in a floating (\`>=\`) dependency pulled in by a rebuild. See the run for details.`,
              labels: ["security", "ci-failure"],
            });
