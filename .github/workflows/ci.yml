name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of any code change — the Dockerfiles pin
    # `>=` version floors, not exact versions, so the actual installed
    # torch/transformers/presidio/etc. versions drift with every base
    # image rebuild. This is what catches a newly-disclosed CVE in
    # whatever actually got installed, without anyone having to
    # remember to re-run a scan by hand.
    - cron: "0 7 * * 1"

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff fastapi httpx pydantic
      - run: ruff check app/ tests/
      - name: API contract tests
        # The two models are stubbed (they are gated and heavy): this pins the
        # request size limits and what a failing axis does to the response.
        run: python3 tests/api_contract_test.py
      - name: scan.sh option tests
        # Fabricated values only; works without gitleaks installed.
        run: bash tests/scan_options_test.sh

  cve-scan-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (Dockerfiles, app source)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  cve-scan-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t guards-unified:ci-cpu .
      - name: Trivy image scan — actual installed deps, not the Dockerfile's version floors
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: guards-unified:ci-cpu
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  redaction-selftest:
    # Runs against the image we would actually ship, not a dev checkout:
    # every secret finding must come back redacted, never "found" with
    # the text unchanged. Synthetic keys are
    # generated at run time; nothing real is involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t guards-unified:selftest .
      - name: Redaction self-test against the built image
        # Runs /app/scan.sh inside the image; the full service is not
        # started because its injection model is a gated Hugging Face
        # download the public CI has no token for.
        run: python3 tests/redaction_selftest.py --image guards-unified:selftest
      - name: Secret-only endpoint, called inside the built image
        # The service cannot start in public CI (gated model), so call the
        # route function directly. No models are loaded by this.
        run: |
          docker run --rm --entrypoint python guards-unified:selftest -c "
          import main
          r = main.scan_secret(main.ScanRequest(text='DB_PASSWORD=Tq7vN2xLm9Kd4RzP8wYb ok'))
          f = r['findings']
          assert len(f) == 1 and f[0]['type'] == 'secret' and f[0]['verdict'] == 'found', r
          assert 'Tq7vN2xLm9Kd4RzP8wYb' not in r['redacted_text'], r
          c = main.scan_secret(main.ScanRequest(text='nothing to see here'))
          assert c['findings'][0]['verdict'] == 'clean' and c['redacted_text'] == 'nothing to see here', c
          print('secret-only endpoint ok')
          "

  flag-scheduled-failure:
    needs: [lint, cve-scan-source, cve-scan-image, redaction-selftest]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue — don't rely on anyone noticing the red check
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI: scheduled lint/CVE scan failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The weekly scheduled run of [this workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed on main with no associated code change — likely a newly-disclosed CVE in a floating (\`>=\`) dependency pulled in by a rebuild. See the run for details.`,
              labels: ["security", "ci-failure"],
            });
