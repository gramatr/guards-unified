name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of any code change — the Dockerfiles pin
    # `>=` version floors, not exact versions, so the actual installed
    # torch/transformers/presidio/etc. versions drift with every base
    # image rebuild. This is what catches a newly-disclosed CVE in
    # whatever actually got installed, without anyone having to
    # remember to re-run a scan by hand.
    - cron: "0 7 * * 1"

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1 fastapi httpx pydantic
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/
      - name: Dockerfile pins
        # No floating tags for external images (uv, base images).
        run: bash tests/dockerfile_pins_test.sh
      - name: PII validators and merge logic
        # Pure python: Presidio is stubbed, no models. Luhn, IBAN mod 97, SSN,
        # phone, IPv4 and email checks with near-miss cases, and the overlap and
        # redaction logic that combines them with Presidio's PERSON/LOCATION, and the
        # filters that drop tool names and identifiers from those two kinds.
        run: |
          python3 tests/validators_test.py
          python3 tests/pii_merge_test.py
          python3 tests/filters_test.py
      - name: API contract tests
        # The two models are stubbed (they are gated and heavy): this pins the
        # request size limits and what a failing axis does to the response.
        run: python3 tests/api_contract_test.py
      - name: scan.sh option tests
        # Fabricated values only; works without gitleaks installed.
        run: bash tests/scan_options_test.sh
      - name: scan.sh bash compatibility
        # No bash-4-only syntax in app/*.sh, and the context rules still redact.
        run: bash tests/scan_bash_compat_test.sh
      - name: Release evidence script
        # The release page is built from tests/release_evidence.sh; it must refuse a
        # missing changelog section, a failing suite and an active .trivyignore entry.
        run: bash tests/release_evidence_test.sh
      - name: Gitleaks assets script
        # The check mode of tests/gitleaks_assets.sh must refuse a differing hash, a missing
        # target and a missing build; the build itself runs in the gitleaks-assets job.
        run: bash tests/gitleaks_assets_test.sh

  scan-macos:
    # macOS ships bash 3.2. v0.2.9 used a bash 4 expansion in scan.sh, so on a Mac
    # every context rule silently stopped redacting while all of CI, which is
    # Linux with bash 5, stayed green. This runs scan.sh under /bin/bash.
    # Only the compat test: scan_options_test.sh has a case (a 20,000-character
    # unbroken run followed by a key) that takes minutes on bash 3.2, a separate
    # performance problem tracked in gramatr/guards-coordination#71.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scan.sh under the system bash (3.2)
        run: |
          /bin/bash --version | head -1
          SCAN_BASH=/bin/bash /bin/bash tests/scan_bash_compat_test.sh

  cve-scan-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (Dockerfiles, app source)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  cve-scan-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t guards-unified:ci-cpu .
      - name: Trivy image scan — actual installed deps, not the Dockerfile's version floors
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: guards-unified:ci-cpu
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  redaction-selftest:
    # Runs against the image we would actually ship, not a dev checkout:
    # every secret finding must come back redacted, never "found" with
    # the text unchanged. Synthetic keys are
    # generated at run time; nothing real is involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t guards-unified:selftest .
      - name: Redaction self-test against the built image
        # Runs /app/scan.sh inside the image; the full service is not
        # started because its injection model is a gated Hugging Face
        # download the public CI has no token for.
        run: python3 tests/redaction_selftest.py --image guards-unified:selftest
      - name: Secret-only endpoint, called inside the built image
        # The service cannot start in public CI (gated model), so call the
        # route function directly. No models are loaded by this.
        run: |
          docker run --rm --entrypoint python guards-unified:selftest -c "
          import main
          r = main.scan_secret(main.ScanRequest(text='DB_PASSWORD=Tq7vN2xLm9Kd4RzP8wYb ok'))
          f = r['findings']
          assert len(f) == 1 and f[0]['type'] == 'secret' and f[0]['verdict'] == 'found', r
          assert 'Tq7vN2xLm9Kd4RzP8wYb' not in r['redacted_text'], r
          c = main.scan_secret(main.ScanRequest(text='nothing to see here'))
          assert c['findings'][0]['verdict'] == 'clean' and c['redacted_text'] == 'nothing to see here', c
          print('secret-only endpoint ok')
          "

  gitleaks-assets:
    # The standalone patched gitleaks binaries (issue #55) are built from the same recipe as
    # the image's gitleaks and must hash to docs/gitleaks-assets.sha256. Running this on every
    # change proves the build is reproducible on GitHub's runners before a release depends on it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the four binaries
        run: bash tests/gitleaks_assets.sh build assets
      - name: Hashes equal docs/gitleaks-assets.sha256
        run: bash tests/gitleaks_assets.sh check assets

  flag-scheduled-failure:
    needs: [lint, cve-scan-source, cve-scan-image, redaction-selftest]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue — don't rely on anyone noticing the red check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI: scheduled lint/CVE scan failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The weekly scheduled run of [this workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) failed on main with no associated code change — likely a newly-disclosed CVE in a floating (\`>=\`) dependency pulled in by a rebuild. See the run for details.`,
              labels: ["security", "ci-failure"],
            });
