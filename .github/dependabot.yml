# Keeps the pins from #54 (Actions by SHA, base images by digest) from going stale.
# Weekly, the same day as the scheduled CVE scan in ci.yml. Every update is a PR that
# must pass the required checks, including the image CVE scan; none merges itself.
#
# Not covered, because Dependabot cannot read them: the gitleaks commit
# (GITLEAKS_COMMIT) and the Go module versions in the Dockerfiles. Those are bumped
# by hand; see docs/CONFIGURATION.md, Supply chain, "Refreshing the pins".
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Digest refreshes of the pinned tags only. Moving to another Python or Go
      # release line is a deliberate change made by a person.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
